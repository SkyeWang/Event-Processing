<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识图谱三元组抽取系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0f1419;
            color: #e7e9ea;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* 头部 */
        .header {
            text-align: center;
            padding: 30px 0 20px;
            border-bottom: 1px solid #2f3336;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .header p { color: #71767b; font-size: 14px; }

        /* 输入区域 */
        .input-section {
            background: #16202a;
            border: 1px solid #2f3336;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .input-section label {
            display: block;
            font-size: 14px;
            color: #71767b;
            margin-bottom: 10px;
        }
        .textarea-wrap {
            position: relative;
        }
        textarea {
            width: 100%;
            min-height: 120px;
            background: #1d2d3a;
            border: 1px solid #3a4a5a;
            border-radius: 12px;
            padding: 16px;
            color: #e7e9ea;
            font-size: 15px;
            line-height: 1.6;
            resize: vertical;
            transition: border-color 0.2s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 16px;
        }
        .lang-select {
            background: #1d2d3a;
            border: 1px solid #3a4a5a;
            color: #e7e9ea;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn-extract {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .btn-extract:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        }
        .btn-extract:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-example {
            background: transparent;
            border: 1px solid #3a4a5a;
            color: #71767b;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-example:hover {
            border-color: #667eea;
            color: #667eea;
        }

        /* 结果区域 */
        .result-section {
            display: none;
        }
        .result-section.active { display: block; }

        /* 图谱可视化 */
        .graph-panel {
            background: #16202a;
            border: 1px solid #2f3336;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            min-height: 400px;
            position: relative;
        }
        .graph-panel h3 {
            font-size: 16px;
            margin-bottom: 16px;
            color: #b0b8c1;
        }
        #graph-canvas {
            width: 100%;
            height: 420px;
            border-radius: 12px;
            background: #0d1520;
        }

        /* 三元组表格 */
        .table-panel {
            background: #16202a;
            border: 1px solid #2f3336;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .table-panel h3 {
            font-size: 16px;
            margin-bottom: 16px;
            color: #b0b8c1;
        }
        .meta-info {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .meta-tag {
            background: #1d2d3a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #8899aa;
        }
        .meta-tag span { color: #667eea; font-weight: 600; }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #2f3336;
            font-size: 14px;
        }
        th {
            background: #1a2a38;
            color: #8899aa;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        td { color: #cdd4da; }
        tr:hover td { background: #1a2530; }
        .entity { color: #667eea; font-weight: 500; }
        .relation-tag {
            display: inline-block;
            background: rgba(118, 75, 162, 0.2);
            color: #b38bdb;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 13px;
        }
        .type-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 12px;
        }
        .type-causal { background: rgba(255, 107, 107, 0.15); color: #ff6b6b; }
        .type-hierarchical { background: rgba(78, 205, 196, 0.15); color: #4ecdc4; }
        .type-associative { background: rgba(255, 190, 11, 0.15); color: #ffbe0b; }
        .type-temporal { background: rgba(72, 149, 239, 0.15); color: #4895ef; }

        /* JSON面板 */
        .json-panel {
            background: #16202a;
            border: 1px solid #2f3336;
            border-radius: 16px;
            padding: 20px;
        }
        .json-panel h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #b0b8c1;
            cursor: pointer;
        }
        .json-content {
            background: #0d1520;
            border-radius: 12px;
            padding: 16px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #a8b5c2;
            max-height: 300px;
            overflow-y: auto;
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        .loading.active { display: block; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #2f3336;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 图例 */
        .legend {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #71767b;
        }
        .legend-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>知识图谱三元组抽取系统</h1>
            <p>基于 Qwen2.5-7B + LoRA 微调模型 · 支持中英文科技新闻文本</p>
        </div>

        <!-- 输入区 -->
        <div class="input-section">
            <label>输入科技新闻文本：</label>
            <div class="textarea-wrap">
                <textarea id="input-text" placeholder="在此粘贴或输入科技新闻文本，模型将自动抽取实体和关系三元组..."></textarea>
            </div>
            <div class="controls">
                <select class="lang-select" id="lang-select">
                    <option value="auto">自动检测语言</option>
                    <option value="zh">中文</option>
                    <option value="en">English</option>
                </select>
                <button class="btn-extract" id="btn-extract" onclick="doExtract()">抽取三元组</button>
                <button class="btn-example" onclick="loadExample('zh')">中文示例</button>
                <button class="btn-example" onclick="loadExample('en')">English Example</button>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>模型推理中，请稍候...</p>
        </div>

        <!-- 结果区 -->
        <div class="result-section" id="result-section">
            <!-- 图谱可视化 -->
            <div class="graph-panel">
                <h3>知识图谱可视化</h3>
                <div class="legend" id="legend">
                    <div class="legend-item"><div class="legend-dot" style="background:#667eea"></div>实体节点</div>
                    <div class="legend-item"><div class="legend-dot" style="background:#ff6b6b"></div>因果关系</div>
                    <div class="legend-item"><div class="legend-dot" style="background:#4ecdc4"></div>层级关系</div>
                    <div class="legend-item"><div class="legend-dot" style="background:#ffbe0b"></div>关联关系</div>
                    <div class="legend-item"><div class="legend-dot" style="background:#4895ef"></div>时序关系</div>
                </div>
                <canvas id="graph-canvas"></canvas>
            </div>

            <!-- 三元组表格 -->
            <div class="table-panel">
                <h3>抽取结果</h3>
                <div class="meta-info" id="meta-info"></div>
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>实体1 (Entity1)</th>
                                <th>关系 (Relation)</th>
                                <th>实体2 (Entity2)</th>
                                <th>关系类型</th>
                                <th>层级</th>
                            </tr>
                        </thead>
                        <tbody id="triples-tbody"></tbody>
                    </table>
                </div>
            </div>

            <!-- JSON原始输出 -->
            <div class="json-panel">
                <h3>原始JSON输出 ▾</h3>
                <div class="json-content" id="json-output"></div>
            </div>
        </div>
    </div>

    <script>
    // 示例文本
    const EXAMPLES = {
        zh: "2024年3月，OpenAI与Figure公司合作推出了Figure 01人形机器人，该机器人基于多模态大模型技术，能够通过自然语言与人交互。Figure公司此前已获得微软、英伟达等科技巨头的投资，估值超过26亿美元。",
        en: "In 2024, NVIDIA announced its next-generation Blackwell GPU architecture, which is designed to accelerate AI training and inference. The B200 chip delivers up to 20 petaflops of AI performance, surpassing the previous Hopper architecture by 5x in large language model workloads."
    };

    function loadExample(lang) {
        document.getElementById('input-text').value = EXAMPLES[lang];
        document.getElementById('lang-select').value = lang;
    }

    async function doExtract() {
        const text = document.getElementById('input-text').value.trim();
        if (!text) { alert('请输入文本'); return; }

        const lang = document.getElementById('lang-select').value;
        const btn = document.getElementById('btn-extract');
        const loading = document.getElementById('loading');
        const resultSection = document.getElementById('result-section');

        btn.disabled = true;
        loading.classList.add('active');
        resultSection.classList.remove('active');

        try {
            const resp = await fetch('/extract', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, lang })
            });
            const data = await resp.json();

            if (data.success) {
                renderResult(data.result, data.language);
            } else {
                alert('抽取失败: ' + (data.error || '未知错误'));
            }
        } catch (e) {
            alert('请求失败: ' + e.message);
        } finally {
            btn.disabled = false;
            loading.classList.remove('active');
        }
    }

    function renderResult(result, lang) {
        const resultSection = document.getElementById('result-section');
        resultSection.classList.add('active');

        // Meta信息
        const metaInfo = document.getElementById('meta-info');
        const year = result.year || '未标注';
        const ktype = result.knowledge_type || '-';
        const tripleCount = (result.triples || []).length;
        metaInfo.innerHTML = `
            <div class="meta-tag">年份: <span>${year}</span></div>
            <div class="meta-tag">知识类型: <span>${ktype}</span></div>
            <div class="meta-tag">三元组数: <span>${tripleCount}</span></div>
            <div class="meta-tag">语言: <span>${lang === 'zh' ? '中文' : 'English'}</span></div>
        `;

        // 表格
        const tbody = document.getElementById('triples-tbody');
        tbody.innerHTML = '';
        const triples = result.triples || [];
        triples.forEach((t, i) => {
            const typeClass = 'type-' + (t.relation_type || 'associative');
            tbody.innerHTML += `
                <tr>
                    <td>${i + 1}</td>
                    <td class="entity">${escapeHtml(t.entity1 || '')}</td>
                    <td><span class="relation-tag">${escapeHtml(t.relation || '')}</span></td>
                    <td class="entity">${escapeHtml(t.entity2 || '')}</td>
                    <td><span class="type-tag ${typeClass}">${t.relation_type || '-'}</span></td>
                    <td>${t.hierarchy_level || '-'}</td>
                </tr>
            `;
        });

        // JSON
        document.getElementById('json-output').textContent = JSON.stringify(result, null, 2);

        // 绘制知识图谱
        drawGraph(triples);
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ============ 力导向图绘制 ============
    function drawGraph(triples) {
        const canvas = document.getElementById('graph-canvas');
        const ctx = canvas.getContext('2d');
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width - 40;
        canvas.height = 420;

        if (!triples || triples.length === 0) {
            ctx.fillStyle = '#71767b';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('暂无三元组数据', canvas.width / 2, canvas.height / 2);
            return;
        }

        // 构建节点和边
        const nodeMap = {};
        const edges = [];
        const typeColors = {
            causal: '#ff6b6b',
            hierarchical: '#4ecdc4',
            associative: '#ffbe0b',
            temporal: '#4895ef'
        };

        triples.forEach(t => {
            if (!nodeMap[t.entity1]) nodeMap[t.entity1] = { id: t.entity1, x: 0, y: 0, vx: 0, vy: 0 };
            if (!nodeMap[t.entity2]) nodeMap[t.entity2] = { id: t.entity2, x: 0, y: 0, vx: 0, vy: 0 };
            edges.push({
                source: t.entity1,
                target: t.entity2,
                relation: t.relation,
                type: t.relation_type || 'associative'
            });
        });

        const nodes = Object.values(nodeMap);
        const W = canvas.width, H = canvas.height;

        // 初始化位置（圆形分布）
        nodes.forEach((n, i) => {
            const angle = (2 * Math.PI * i) / nodes.length;
            const r = Math.min(W, H) * 0.3;
            n.x = W / 2 + r * Math.cos(angle);
            n.y = H / 2 + r * Math.sin(angle);
        });

        // 力导向模拟
        const iterations = 150;
        for (let iter = 0; iter < iterations; iter++) {
            const alpha = 1 - iter / iterations;
            // 斥力
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    let dx = nodes[j].x - nodes[i].x;
                    let dy = nodes[j].y - nodes[i].y;
                    let dist = Math.sqrt(dx * dx + dy * dy) || 1;
                    let force = 8000 / (dist * dist);
                    let fx = (dx / dist) * force * alpha;
                    let fy = (dy / dist) * force * alpha;
                    nodes[i].vx -= fx; nodes[i].vy -= fy;
                    nodes[j].vx += fx; nodes[j].vy += fy;
                }
            }
            // 引力（边）
            edges.forEach(e => {
                let s = nodeMap[e.source], t = nodeMap[e.target];
                let dx = t.x - s.x, dy = t.y - s.y;
                let dist = Math.sqrt(dx * dx + dy * dy) || 1;
                let force = (dist - 120) * 0.01 * alpha;
                let fx = (dx / dist) * force;
                let fy = (dy / dist) * force;
                s.vx += fx; s.vy += fy;
                t.vx -= fx; t.vy -= fy;
            });
            // 居中力
            nodes.forEach(n => {
                n.vx += (W / 2 - n.x) * 0.001 * alpha;
                n.vy += (H / 2 - n.y) * 0.001 * alpha;
            });
            // 更新位置
            nodes.forEach(n => {
                n.vx *= 0.85; n.vy *= 0.85;
                n.x += n.vx; n.y += n.vy;
                n.x = Math.max(60, Math.min(W - 60, n.x));
                n.y = Math.max(40, Math.min(H - 40, n.y));
            });
        }

        // 绘制
        ctx.clearRect(0, 0, W, H);

        // 绘制边
        edges.forEach(e => {
            const s = nodeMap[e.source], t = nodeMap[e.target];
            const color = typeColors[e.type] || '#667eea';

            ctx.beginPath();
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(t.x, t.y);
            ctx.strokeStyle = color + '80';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // 箭头
            const angle = Math.atan2(t.y - s.y, t.x - s.x);
            const midX = (s.x + t.x) / 2;
            const midY = (s.y + t.y) / 2;
            ctx.beginPath();
            ctx.moveTo(midX + 6 * Math.cos(angle), midY + 6 * Math.sin(angle));
            ctx.lineTo(midX - 6 * Math.cos(angle - 0.5), midY - 6 * Math.sin(angle - 0.5));
            ctx.lineTo(midX - 6 * Math.cos(angle + 0.5), midY - 6 * Math.sin(angle + 0.5));
            ctx.fillStyle = color;
            ctx.fill();

            // 关系标签
            ctx.font = '11px sans-serif';
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.fillText(e.relation, midX, midY - 8);
        });

        // 绘制节点
        nodes.forEach(n => {
            ctx.beginPath();
            ctx.arc(n.x, n.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#667eea';
            ctx.fill();
            ctx.strokeStyle = '#0f1419';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 标签
            ctx.font = '12px sans-serif';
            ctx.fillStyle = '#e7e9ea';
            ctx.textAlign = 'center';
            ctx.fillText(n.id, n.x, n.y - 12);
        });
    }

    // 窗口大小变化时重绘
    window.addEventListener('resize', () => {
        const section = document.getElementById('result-section');
        if (section.classList.contains('active')) {
            // 重新从JSON获取数据重绘
            try {
                const json = JSON.parse(document.getElementById('json-output').textContent);
                if (json.triples) drawGraph(json.triples);
            } catch(e) {}
        }
    });

    // 快捷键 Ctrl+Enter 触发抽取
    document.getElementById('input-text').addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            doExtract();
        }
    });
    </script>
</body>
</html>
